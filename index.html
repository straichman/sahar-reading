<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>קריאה ביום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap nik" style="max-width:800px">
  <div style="text-align:center;margin:10px 0 18px">
    <div style="font-size:70px">📚</div>
    <h1 style="margin:0;font-size:36px">שָׁלוֹם סַהַר! 👋</h1>
    <p style="font-size:22px;margin:6px 0 0;color:var(--muted)">כָּל בֹּקֶר מְחַכָּה לְךָ קְרִיאָה חֲדָשָׁה. עַל כָּל קְרִיאָה מְקַבְּלִים מַדְבֵּקָה!</p>
  </div>
  <div id="latest"></div>
  <h2 style="margin:24px 0 12px">🗂️ אַלְבּוֹם הַמַּדְבֵּקוֹת שֶׁלִּי <small id="count" style="font-size:18px;color:var(--muted)"></small></h2>
  <div class="album" id="album"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
(async()=>{
  const stk=get("sahar-stickers",{});
  let idx;
  try{ idx=await (await fetch("days/index.json",{cache:"no-store"})).json(); }catch(e){ $("#latest").innerHTML="<p>לֹא הִצְלַחְתִּי לִטְעֹן. נַסֵּה לְרַעְנֵן.</p>"; return; }
  const W=idx.days, last=W[W.length-1];
  $("#latest").innerHTML=`<a class="hero" href="play.html?d=${last.n}" style="display:block;text-decoration:none;background:${esc(last.color||"#3a7bff")}">
     <h1>הַקְּרִיאָה שֶׁל הַיּוֹם: ${esc(last.title)}</h1><p>${stk[last.n]?"קָרָאתָ! אֶפְשָׁר לְשַׂחֵק שׁוּב ✨":"לְחַץ כְּדֵי לְהַתְחִיל ⬅"}</p><div class="big">${last.emoji||last.sticker}</div></a>`;
  let got=0;
  $("#album").innerHTML=W.slice().reverse().map(w=>{const has=!!stk[w.n];if(has)got++;
    return `<a class="slot ${has?"":"no"}" href="play.html?d=${w.n}"><span class="s">${w.sticker}</span><b>${esc(w.date.slice(0,5))}</b><br><small>${esc(w.title)}</small>${w.n===last.n&&!has?'<br><span class="newbadge">חָדָשׁ!</span>':""}</a>`}).join("");
  $("#count").textContent=`(${got} מִתּוֹךְ ${W.length})`;
})();
</script>
</body>
</html>
